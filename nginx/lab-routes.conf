# The routes of a codelab lab, shared by the HTTPS front and the plain HTTP
# front used for local tests. It is included inside a server block.

# Redirects carry only the path, so the browser keeps the host and port it
# came in on.
absolute_redirect off;

# --- start page ----------------------------------------------------------
root /srv/www;
index index.html;

location = / {
    add_header Cache-Control "no-cache";
}

# The QR code on the start page is drawn again on every run of lab-init.sh,
# so the browser must not keep an old one.
location /qr/ {
    add_header Cache-Control "no-cache";
}

# --- the editor ----------------------------------------------------------
# code-server works under a path as long as the prefix is stripped, which
# the rewrite does.
#
# The upstream is a variable so nginx looks the name up through Docker's
# DNS on each request. A fixed name is resolved once at start, and nginx
# would answer 502 after the workspace container is recreated with a new
# address.
location = /ide {
    return 302 /ide/;
}

location /ide/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $workspace http://workspace:8080;
    rewrite ^/ide/(.*)$ /$1 break;
    proxy_pass $workspace;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding   gzip;
    proxy_read_timeout  1d;
    proxy_send_timeout  1d;
    proxy_buffering     off;
}

# --- the app -------------------------------------------------------------
# The Wasm bundle that Gradle writes after every save. The browser always
# asks again, so a refresh shows the newest build.
location = /app {
    return 302 /app/;
}

location /app/ {
    alias /srv/home/kotlin-fhir-engine/codelabs/shared/build/dist/wasmJs/developmentExecutable/;
    index index.html;
    add_header Cache-Control "no-cache";
    # The app keeps its database in the browser, and the browser only allows
    # that on a page that is isolated from other sites. These two headers ask
    # for that. A page that frames the app must send them as well.
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
    gzip on;
    gzip_types application/wasm application/javascript application/json;
    error_page 403 404 /building.html;
}

# What the build watcher last did. The preview page polls it to know when
# to reload the app.
location = /app-status.json {
    alias /srv/home/.codelab/status.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}

# The output of the build watcher, and the page that follows it. The editor
# shows that page in its Build log pane.
location = /build.log {
    alias /srv/home/build.log;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store";
}

location = /buildlog {
    return 302 /buildlog/;
}

location /buildlog/ {
    add_header Cache-Control "no-cache";
}

# The app with a toolbar and an output panel around it. This is the page a
# learner keeps open as the App tab.
location = /preview {
    return 302 /preview/;
}

location /preview/ {
    add_header Cache-Control "no-cache";
    # The app keeps its database in the browser, and the browser only allows
    # that on a page that is isolated from other sites. These two headers ask
    # for that. A page that frames the app must send them as well.
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
}

# What the app printed, read from the browser's storage. The editor shows
# this page in its Output tab.
location = /output {
    return 302 /output/;
}

location /output/ {
    add_header Cache-Control "no-cache";
}

# It is shown inside the preview frame, so it needs the same two headers as
# the app or the browser refuses to show it there.
location = /building.html {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
}

# --- the FHIR server -----------------------------------------------------
# HAPI serves /fhir itself, so the path passes through unchanged. It is on
# the same address as the app, so the browser needs no cross site rules to
# let the app call it. The forwarded headers let HAPI write the lab address
# into the links of a Bundle.
#
# /fhir with nothing after it is passed on as well, and not redirected. HAPI
# writes the link to the next page of a long result as /fhir?_getpages=...
location ~ ^/fhir(/|$) {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hapi http://hapi:8080;
    proxy_pass $hapi;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
    add_header Cache-Control "no-store";
    # Shown while the server is still starting, which takes a minute or two.
    error_page 502 504 = @fhir_starting;
}

location @fhir_starting {
    default_type text/plain;
    add_header Retry-After 10 always;
    return 503 "The FHIR server is still starting. Wait a minute and reload this page.\n";
}
